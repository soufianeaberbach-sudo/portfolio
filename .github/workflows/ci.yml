name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 is what the project is developed against and what Astro 5 and
      # Wrangler 4 both support.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # Validates worker/index.ts and wrangler.jsonc without deploying or
      # needing any Cloudflare credential.
      - name: Validate Worker configuration
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dry

      # Backend behaviour: the Worker driven directly with a stub KV and a stub
      # fetch. No Cloudflare account, no network, no browser — so it runs before
      # the slower browser install and fails fast.
      - name: Worker backend tests
        run: npm run test:worker

      # Fails if the old website domain reappears in source or in the built
      # output — canonical, og:url, structured data, sitemap, robots or the
      # Turnstile hostname allowlist. Also asserts the public contact address
      # is still present, and that no locale route or tracker has crept in.
      - name: Domain and canonical guard
        run: npm run test:domain

      # Stubbed diagnostics tests only. Never run live production verification
      # as a CI prerequisite while external activation remains pending.
      - name: Read-only production checker tests
        run: npm run test:production

      # Uses the Playwright pinned in devDependencies, so the browser build
      # always matches the package the tests import. No temporary npx package.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run test:smoke

      - name: Menswear photographic content contracts
        run: |
          node tests/menswear-content.mjs
          node tests/menswear-ai-collection.mjs --require-complete
          node tests/menswear-web-images.mjs
          node tests/final-photography.mjs
          node tests/womenswear-ten-looks.mjs
          node tests/fashion-source-integrity.mjs

      - name: Menswear and protected Womenswear continuity
        shell: bash
        run: |
          node node_modules/astro/astro.js preview --host 127.0.0.1 --port 4457 > /tmp/menswear-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4457/portfolio/ > /dev/null
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-navigation.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-look-navigation.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-resize-return.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/womenswear-continuity.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/garment-match-cut.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/fashion-navigation.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/fashion-eight-worlds.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-presentation-seeks.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-historical-access.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-archive-keyboard.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/fashion-chapter-history.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/womenswear-route-origin.mjs
          PORTFOLIO_QA_URL=http://127.0.0.1:4457 node tests/menswear-media-loading.mjs
          node tests/three-panel-photography.mjs
