<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Upper band and gathered tab"><title>Upper band and gathered tab</title><style>.edge{stroke:#202521;stroke-width:1.65;fill:var(--cloth,#fff)}.seam{stroke:#303b34;stroke-width:1;fill:none}.stitch{stroke:#566058;stroke-width:.65;stroke-dasharray:2.6 2;fill:none}.fold{stroke:#738078;stroke-width:.7;fill:none}.hidden{stroke:#6a7870;stroke-width:.8;stroke-dasharray:5 3;fill:none}.dim{stroke:#a14a35;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#a14a35;stroke-width:.6;fill:none}.note{fill:#3d4840;font-family:Arial,sans-serif}.pomlabel{fill:#913d2b;font-family:Arial,sans-serif;font-weight:bold}.callout{fill:white;stroke:#536b60;stroke-width:1.1}.leader{stroke:#536b60;stroke-width:.85;fill:none}.section{fill:#efefeb;stroke:#303b34;stroke-width:1}.swatch{stroke:#303b34;stroke-width:1}*{stroke-linejoin:round;stroke-linecap:round}</style><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0 L0 2.5 L5 5" fill="none" stroke="#a14a35" stroke-width=".7"/></marker><pattern id="stripe" width="126" height="126" patternUnits="userSpaceOnUse" patternTransform="rotate(43)"><rect width="126" height="126" fill="#ece7d8"/><rect width="63" height="126" fill="#afc5d7"/></pattern></defs><text x="32" y="38" font-size="20" class="note">Upper band and gathered tab</text><text x="32" y="64" font-size="12" class="note">PROPOSED / schematic — not a cutting pattern</text><path d="M80 180 Q240 145 480 163 L480 250 Q240 216 80 295 Z" class="edge" fill="none"  /><path d="M360 165 Q280 190 190 220 M360 187 Q300 207 243 227 M360 208 Q324 228 288 235" class="fold" fill="none"  /><path d="M360 160 L402 160 L406 242 L365 242 Z" class="edge" fill="none"  /><text x="78" y="335" font-size="14" class="note">Folded self band; localized folds at wearer-left tab</text><path d="M100 395 L470 395 L470 413 L100 413 Z" class="section" fill="none"  /><path d="M100 418 L470 418" class="seam" fill="none"  /><text x="100" y="452" font-size="14" class="note">Section: double band encloses concealed neckline join</text><text x="100" y="478" font-size="14" class="note">6 mm join / 514; tab secured inside only</text></svg>