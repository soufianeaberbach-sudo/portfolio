<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="CB zip and rear-neck closure"><title>CB zip and rear-neck closure</title><style>.edge{stroke:#202521;stroke-width:1.65;fill:var(--cloth,#fff)}.seam{stroke:#303b34;stroke-width:1;fill:none}.stitch{stroke:#566058;stroke-width:.65;stroke-dasharray:2.6 2;fill:none}.fold{stroke:#738078;stroke-width:.7;fill:none}.hidden{stroke:#6a7870;stroke-width:.8;stroke-dasharray:5 3;fill:none}.dim{stroke:#a14a35;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#a14a35;stroke-width:.6;fill:none}.note{fill:#3d4840;font-family:Arial,sans-serif}.pomlabel{fill:#913d2b;font-family:Arial,sans-serif;font-weight:bold}.callout{fill:white;stroke:#536b60;stroke-width:1.1}.leader{stroke:#536b60;stroke-width:.85;fill:none}.section{fill:#efefeb;stroke:#303b34;stroke-width:1}.swatch{stroke:#303b34;stroke-width:1}*{stroke-linejoin:round;stroke-linecap:round}</style><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0 L0 2.5 L5 5" fill="none" stroke="#a14a35" stroke-width=".7"/></marker><pattern id="stripe" width="126" height="126" patternUnits="userSpaceOnUse" patternTransform="rotate(43)"><rect width="126" height="126" fill="#ece7d8"/><rect width="63" height="126" fill="#afc5d7"/></pattern></defs><text x="32" y="38" font-size="20" class="note">CB zip and rear-neck closure</text><text x="32" y="64" font-size="12" class="note">PROPOSED / schematic — not a cutting pattern</text><rect x="110" y="125" width="170" height="70" class="edge" fill="none"/><rect x="300" y="125" width="170" height="70" class="edge" fill="none"/><circle cx="290" cy="145" r="5" class="seam" fill="white"/><circle cx="290" cy="174" r="5" class="seam" fill="white"/><path d="M278 142 Q303 135 301 145 Q300 154 278 149 M278 171 Q303 164 301 174 Q300 183 278 178" class="seam" fill="none"  /><path d="M280 260 L280 450 M300 260 L300 450" class="s