<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Double-welt pocket"><title>Double-welt pocket</title><style>.edge{stroke:#202521;stroke-width:1.65;fill:var(--cloth,#fff)}.seam{stroke:#303b34;stroke-width:1;fill:none}.stitch{stroke:#566058;stroke-width:.65;stroke-dasharray:2.6 2;fill:none}.fold{stroke:#738078;stroke-width:.7;fill:none}.hidden{stroke:#6a7870;stroke-width:.8;stroke-dasharray:5 3;fill:none}.dim{stroke:#a14a35;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#a14a35;stroke-width:.6;fill:none}.note{fill:#3d4840;font-family:Arial,sans-serif}.pomlabel{fill:#913d2b;font-family:Arial,sans-serif;font-weight:bold}.callout{fill:white;stroke:#536b60;stroke-width:1.1}.leader{stroke:#536b60;stroke-width:.85;fill:none}.section{fill:#efefeb;stroke:#303b34;stroke-width:1}.swatch{stroke:#303b34;stroke-width:1}*{stroke-linejoin:round;stroke-linecap:round}</style><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0 L0 2.5 L5 5" fill="none" stroke="#a14a35" stroke-width=".7"/></marker><pattern id="stripe" width="126" height="126" patternUnits="userSpaceOnUse" patternTransform="rotate(43)"><rect width="126" height="126" fill="#ece7d8"/><rect width="63" height="126" fill="#afc5d7"/></pattern></defs><text x="32" y="38" font-size="20" class="note">Double-welt pocket</text><text x="32" y="64" font-size="12" class="note">PROPOSED / schematic — not a cutting pattern</text><rect x="85" y="140" width="420" height="220" class="edge" fill="none"/><rect x="145" y="205" width="300" height="50" class="section" fill="none"/><line x1="145" y1="230" x2="445" y2="230" class="seam"/><path d="M150 230 L440 230 M150 230 L165 210 M150 230 L165 250 M440 230 L425 210 M440 230 L425 250" class="hidden" fill="none"  /><path d="M145 255 L145 405 Q295 445 445 405 L445 255" class="hidden" fill="none"  /><line x1="145" y1="183" x2="445" y2="183" class="dim"/><text x="275" y="173" font-size="13" class="pomlabel">12 cm</text><line x1="470" y1="205" x2="470" y2="255" class="dim"/><text x="476.0" y="222.0" font-size="13" class="pomlabel">1 cm</text><text x="85" y="478" font-size="14" class="note">Two 5 mm welt lips; secure corner triangles to welts</text><text x="85" y="504" font-size="14" class="note">Bag depth 16 cm / fused opening; no rear button</text></svg>