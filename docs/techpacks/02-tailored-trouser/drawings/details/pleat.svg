<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Front pleat / pocket interface"><title>Front pleat / pocket interface</title><style>.edge{stroke:#202521;stroke-width:1.65;fill:var(--cloth,#fff)}.seam{stroke:#303b34;stroke-width:1;fill:none}.stitch{stroke:#566058;stroke-width:.65;stroke-dasharray:2.6 2;fill:none}.fold{stroke:#738078;stroke-width:.7;fill:none}.hidden{stroke:#6a7870;stroke-width:.8;stroke-dasharray:5 3;fill:none}.dim{stroke:#a14a35;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#a14a35;stroke-width:.6;fill:none}.note{fill:#3d4840;font-family:Arial,sans-serif}.pomlabel{fill:#913d2b;font-family:Arial,sans-serif;font-weight:bold}.callout{fill:white;stroke:#536b60;stroke-width:1.1}.leader{stroke:#536b60;stroke-width:.85;fill:none}.section{fill:#efefeb;stroke:#303b34;stroke-width:1}.swatch{stroke:#303b34;stroke-width:1}*{stroke-linejoin:round;stroke-linecap:round}</style><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0 L0 2.5 L5 5" fill="none" stroke="#a14a35" stroke-width=".7"/></marker><pattern id="stripe" width="126" height="126" patternUnits="userSpaceOnUse" patternTransform="rotate(43)"><rect width="126" height="126" fill="#ece7d8"/><rect width="63" height="126" fill="#afc5d7"/></pattern></defs><text x="32" y="38" font-size="20" class="note">Front pleat / pocket interface</text><text x="32" y="64" font-size="12" class="note">PROPOSED / schematic — not a cutting pattern</text><path d="M100 130 L500 130 L515 375 L85 375 Z" class="edge" fill="none"  /><path d="M230 130 L230 330 M260 130 L260 255 M400 130 L465 315" class="seam" fill="none"  /><path d="M410 155 Q450 215 470 306 Q401 354 335 305 L335 150 Z" class="hidden" fill="none"  /><line x1="230" y1="112" x2="275" y2="112" class="dim"/><text x="210" y="98" font-size="13" class="pomlabel">3 cm intake</text><line x1="264" y1="185" x2="233" y2="185" class="dim"/><text x="90" y="425" font-size="14" class="note">Fold toward CF; bag caught in waistband allowance</text><text x="90" y="453" font-size="14" class="note">Pleat is not a dart; release below waist basting</text></svg>