<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Fly / waistband closure"><title>Fly / waistband closure</title><style>.edge{stroke:#202521;stroke-width:1.65;fill:var(--cloth,#fff)}.seam{stroke:#303b34;stroke-width:1;fill:none}.stitch{stroke:#566058;stroke-width:.65;stroke-dasharray:2.6 2;fill:none}.fold{stroke:#738078;stroke-width:.7;fill:none}.hidden{stroke:#6a7870;stroke-width:.8;stroke-dasharray:5 3;fill:none}.dim{stroke:#a14a35;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#a14a35;stroke-width:.6;fill:none}.note{fill:#3d4840;font-family:Arial,sans-serif}.pomlabel{fill:#913d2b;font-family:Arial,sans-serif;font-weight:bold}.callout{fill:white;stroke:#536b60;stroke-width:1.1}.leader{stroke:#536b60;stroke-width:.85;fill:none}.section{fill:#efefeb;stroke:#303b34;stroke-width:1}.swatch{stroke:#303b34;stroke-width:1}*{stroke-linejoin:round;stroke-linecap:round}</style><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0 L0 2.5 L5 5" fill="none" stroke="#a14a35" stroke-width=".7"/></marker><pattern id="stripe" width="126" height="126" patternUnits="userSpaceOnUse" patternTransform="rotate(43)"><rect width="126" height="126" fill="#ece7d8"/><rect width="63" height="126" fill="#afc5d7"/></pattern></defs><text x="32" y="38" font-size="20" class="note">Fly / waistband closure</text><text x="32" y="64" font-size="12" class="note">PROPOSED / schematic — not a cutting pattern</text><rect x="85" y="125" width="190" height="45" class="edge" fill="none"/><rect x="275" y="125" width="220" height="45" class="edge" fill="none"/><rect x="275" y="125" width="45" height="45" class="section" fill="none"/><path d="M275 170 L275 397 Q320 397 320 355 L320 170" class="edge" fill="none"  /><rect x="283" y="184" width="10" height="170" class="section" fill="none"/><line x1="285" y1="188" x2="291" y2="188" class="seam"/><line x1="285" y1="196" x