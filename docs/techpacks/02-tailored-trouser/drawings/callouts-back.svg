<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 500 670" role="img" aria-label="Tailored Trouser / back callouts"><title>Tailored Trouser / back callouts</title><style>.edge{stroke:#202521;stroke-width:1.65;fill:var(--cloth,#fff)}.seam{stroke:#303b34;stroke-width:1;fill:none}.stitch{stroke:#566058;stroke-width:.65;stroke-dasharray:2.6 2;fill:none}.fold{stroke:#738078;stroke-width:.7;fill:none}.hidden{stroke:#6a7870;stroke-width:.8;stroke-dasharray:5 3;fill:none}.dim{stroke:#a14a35;stroke-width:1;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#a14a35;stroke-width:.6;fill:none}.note{fill:#3d4840;font-family:Arial,sans-serif}.pomlabel{fill:#913d2b;font-family:Arial,sans-serif;font-weight:bold}.callout{fill:white;stroke:#536b60;stroke-width:1.1}.leader{stroke:#536b60;stroke-width:.85;fill:none}.section{fill:#efefeb;stroke:#303b34;stroke-width:1}.swatch{stroke:#303b34;stroke-width:1}*{stroke-linejoin:round;stroke-linecap:round}</style><defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M5 0 L0 2.5 L5 5" fill="none" stroke="#a14a35" stroke-width=".7"/></marker><pattern id="stripe" width="126" height="126" patternUnits="userSpaceOnUse" patternTransform="rotate(43)"><rect width="126" height="126" fill="#ece7d8"/><rect width="63" height="126" fill="#afc5d7"/></pattern></defs><path d="M145 75 Q250 65 355 75 Q378 144 378 238 L405 650 L275 650 L267 427 Q264 333 250 298 Q236 333 233 427 L225 650 L95 650 L122 238 Q122 144 145 75 Z" class="edge" fill="none"  /><path d="M139 101 Q250 91 361 101" class="seam" fill="none"  /><path d="M250 70 C245 128 240 231 250 298 M191 98 L198 160 L205 97 M295 97 L302 160 L309 98" class="seam" fill="none"  /><rect x="144" y="169" width="68" height="10" class="seam" fill="none"/><line x1="144" y1="174" x2="212" y2="174" class="seam"/><rect x="288" y="169" width="68" height="10" class="seam" fill="none"/><line x1="288" y1="174" x2="356" y2="174" class=