<!doctype html>
<html lang="{{locale}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soufiane Aberbach — {{edition}}</title>
<style>
{{fonts}}
:root{font-size:16px;--ink:#11110F;--muted:#6E6D64;--soft:#383832;--signal:#D45F36;--line:#d7d7d1;--display:Archivo,Arial,sans-serif;--body:Inter,Arial,sans-serif;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0;color:var(--ink);background:#fff}body{font-family:var(--body);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.sheet{position:relative;width:210mm;height:297mm;padding:38px 46px 42px;background:#fff;overflow:hidden}
{{brandCSS}}
.brand{line-height:1.5}
.masthead{display:flex;align-items:center;gap:20px;height:36px}.masthead__rule{height:1px;background:var(--line);flex:1}.construction{position:absolute;right:0;top:9px;width:34px;height:auto;opacity:.48;display:block}.edition{font:8px/1.5 var(--mono);letter-spacing:1px;color:var(--muted);text-align:right}.identity{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:30px;margin-top:18px;align-items:start}.name{font-family:var(--display);font-size:52px;line-height:.92;font-weight:850;letter-spacing:-3.1px;margin:0 0 14px;font-variation-settings:'wdth' 110}.name span{display:block}.name__outline{color:transparent;-webkit-text-stroke:1px var(--ink);font-variation-settings:'wdth' 100}.title{font-family:var(--display);font-size:17px;line-height:1.25;font-weight:600;letter-spacing:-.25px;margin:0;max-width:460px}.title span{display:inline}.title span+span:before{content:" "}.portrait-frame{margin:0;position:relative}.portrait{display:block;width:145px;height:150px;object-fit:cover;object-position:50% 34%}.portrait-frame:after{content:'';position:absolute;bottom:0;left:-9px;width:2px;height:28px;background:var(--signal)}.contact{font-style:normal;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:10px;line-height:1.6;color:var(--soft);margin-top:15px}.contact__location{color:var(--muted)}.intro{margin-top:16px;border-top:1px solid var(--ink);padding-top:15px}.summary{font-size:12.2px;line-height:1.6;letter-spacing:-.08px;margin:0}.section-title{font:500 8.5px/1.5 var(--mono);letter-spacing:1.6px;text-transform:uppercase;margin:0;color:var(--muted)}.experience{margin-top:18px}.experience>.section-title{margin-bottom:13px}.chronology{position:relative}.chronology:before{content:'';position:absolute;left:102px;top:3px;bottom:6px;width:1px;background:var(--line)}.role{display:grid;grid-template-columns:104px minmax(0,1fr);gap:23px;margin:0 0 12px;break-inside:avoid;position:relative}.role--current:before{content:'';position:absolute;left:99.5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--signal)}.role__meta{font:9px/1.65 var(--mono);color:var(--muted);margin:0;padding-right:14px}.role__meta time{display:block}.role__meta .to{display:block}.role__meta .to time{display:inline}.role__company{font-family:var(--display);font-size:15px;line-height:1.2;letter-spacing:-.3px;font-weight:650;margin:0}.role--current .role__company{font-size:18px}.role__location{font:10px/1.4 var(--body);color:var(--muted)}.role__title{font-size:11.7px;line-height:1.45;font-weight:550;margin:3px 0 0}.role--current .role__title{font-weight:650}.role__scope{font-size:11.6px;line-height:1.5;color:var(--soft);margin:5px 0 0;max-width:550px}.foundation{margin:10px 0 9px 127px;font:8px/1.5 var(--mono);color:var(--muted);letter-spacing:.15px}.role__bullets{margin:5px 0 0;padding-left:14px;font-size:11.6px;line-height:1.5;color:var(--soft)}.role__bullets li{margin-bottom:3px}.role__bullets li::marker{color:var(--signal)}.role--early{margin-bottom:10px}.role--early .role__company{font-size:12px}.role--early .role__title{font-size:11px;line-height:1.4;margin-top:2px}.role--early .role__scope{font-size:10.5px;margin-top:2px;color:var(--muted)}.expertise{position:relative;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.expertise>.section-title{margin-bottom:22px}.skill-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:23px}.skill-group h3{font:600 11px/1.45 var(--body);margin:0 0 5px;color:var(--ink)}.skill-group p{font-size:11.2px;line-height:1.55;color:var(--soft);margin:0}.systems{display:grid;grid-template-columns:1.8fr 1fr;gap:27px;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}.systems .section-title{margin-bottom:7px}.systems p{font-size:10.6px;line-height:1.65;margin:0;color:var(--soft)}.footer{position:absolute;bottom:39px;left:46px;right:46px;display:flex;align-items:center;justify-content:space-between;gap:20px;font:7px/1.5 var(--mono);letter-spacing:1px;color:var(--muted);text-transform:uppercase}.footer a{color:var(--ink)}
html[data-render='png'],html[data-render='png'] body{width:2480px;height:3508px;overflow:hidden}html[data-render='png'] .sheet{transform:scale(3.1246031746);transform-origin:top left}@page{size:A4;margin:0}@media print{html,body{width:210mm;height:297mm}.sheet{transform:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>
<body><main class="sheet" aria-label="{{documentLabel}}">
<div class="masthead"><a class="brand" href="https://aberbach.co" aria-label="Soufiane Aberbach"><span>SA</span><i aria-hidden="true"></i></a><span class="masthead__rule" aria-hidden="true"></span><span class="edition">{{edition}}<br>2026 / A4</span></div>
<header class="identity"><div><h1 class="name"><span>Soufiane</span><span class="name__outline">Aberbach</span></h1><p class="title">{{displayTitle}}</p></div><figure class="portrait-frame"><img class="portrait" src="{{portrait}}" alt="Soufiane Aberbach"></figure></header>
<address class="contact"><span class="contact__location">{{location}}</span><a href="https://aberbach.co">aberbach.co</a><a href="mailto:{{email}}">{{email}}</a><a href="https://www.linkedin.com/in/soufiane-aberbach-6799b7155">LinkedIn</a></address>
<section class="intro" aria-label="{{profileLabel}}"><p class="summary">{{summary}}</p></section>
<section class="experience"><h2 class="section-title">{{experienceLabel}}</h2><div class="chronology">{{roles}}</div></section>
<section class="expertise"><img class="construction" src="{{construction}}" alt="" aria-hidden="true"><h2 class="section-title">{{expertiseLabel}}</h2><div class="skill-grid">{{skills}}</div></section>
<div class="systems"><section><h2 class="section-title">{{softwareLabel}}</h2><p>{{software}}</p></section><section class="languages"><h2 class="section-title">{{languagesLabel}}</h2><p>{{languages}}</p></section></div>
<footer class="footer"><a href="https://aberbach.co">ABERBACH.CO</a><span>{{footer}}</span><span>01 / 01</span></footer>
</main></body></html>
