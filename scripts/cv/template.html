<!doctype html>
<html lang="{{locale}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soufiane Aberbach — {{edition}}</title>
<style>
{{fonts}}
:root{font-size:16px;--ink:#11110F;--muted:#6E6D64;--soft:#383832;--signal:#D45F36;--display:Archivo,Arial,sans-serif;--body:Inter,Arial,sans-serif;--editorial:'Bodoni Moda',Georgia,serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;color:var(--ink);background:#fff}body{font-family:var(--body);-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}
.sheet{position:relative;width:210mm;height:297mm;padding:40px 46px 42px;background:#fff;overflow:hidden}
{{brandCSS}}
.brand{line-height:1.5}.masthead{height:34px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:3}.edition{font-size:7.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
.hero{height:275px;position:relative;z-index:2}.identity{position:relative;z-index:2;padding-top:30px;max-width:390px}.name{font:450 60px/.95 var(--editorial);font-optical-sizing:auto;letter-spacing:-2.6px;margin:0 0 17px}.name span{display:block}.title{font:500 12px/1.55 var(--body);letter-spacing:1.7px;text-transform:uppercase;color:var(--signal);margin:0;max-width:350px}.title span{display:block}
.portrait-frame{position:absolute;right:-2px;top:-26px;width:317px;height:348px;margin:0;z-index:1;pointer-events:none;mask-image:linear-gradient(to bottom,#000 0%,#000 74%,transparent 100%)}.portrait{display:block;width:100%;height:auto;mask-image:url("{{portraitMask}}");mask-size:100% 100%;mask-repeat:no-repeat}
.contact{display:flex;gap:6px 17px;flex-wrap:wrap;font:normal 9.5px/1.6 var(--body);margin:0 0 22px;color:var(--soft);position:relative;z-index:3}.contact__location{color:var(--muted)}
.body-grid{display:grid;grid-template-columns:206px minmax(0,1fr);gap:43px;position:relative;z-index:2;align-items:start}.sidebar section+section{margin-top:20px}.section-title{font:600 10px/1.4 var(--body);letter-spacing:2px;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}.section-title:after{content:'';display:block;width:22px;height:2px;background:var(--signal)}.sidebar p{font-size:12px;line-height:1.6;color:var(--soft);margin:0}.skill-group+.skill-group{margin-top:11px}.skill-group h3{font:600 11.5px/1.4 var(--body);margin:0 0 3px}.skill-group p{font-size:11.7px;line-height:1.55}.tool{white-space:nowrap}.software p,.languages p{font-size:11.3px;line-height:1.75}
.experience>.section-title{margin-bottom:19px}.role{margin-bottom:14px;break-inside:avoid}.role__company{font:500 23px/1.12 var(--editorial);letter-spacing:-.3px;margin:0 0 5px}.role--current .role__company{font-size:30px}.role__location{font:9.5px/1.4 var(--body);letter-spacing:0;color:var(--muted)}.role__title{font-size:12.2px;font-weight:500;line-height:1.5;margin:0 0 5px}.role--current .role__title{font-weight:600}.role__meta{font-size:10.2px;line-height:1.5;color:var(--muted);margin:0}.role--current .role__meta{color:var(--signal)}.role--early{margin-bottom:10px}.role--early .role__company{font-size:21px}.role--early .role__title{font-size:11.5px}.practice{margin-top:20px}.practice .section-title{font-size:9px;letter-spacing:1.5px}.practice p{text-wrap:pretty;font-size:12px;line-height:1.65;margin:0 0 10px;color:var(--soft)}
.atelier{position:absolute;left:46px;top:943px;width:205px;height:126px;object-fit:contain;object-position:left center;opacity:.72;z-index:0;mask-image:linear-gradient(to bottom,transparent 0%,#000 22%,#000 72%,transparent 100%)}
.footer{position:absolute;bottom:39px;left:46px;right:46px;display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:7px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;z-index:3}.footer a{color:var(--ink)}
html[data-render='png'],html[data-render='png'] body{width:2480px;height:3508px;overflow:hidden}html[data-render='png'] .sheet{transform:scale(3.1246031746);transform-origin:top left}@page{size:A4;margin:0}@media print{html,body{width:210mm;height:297mm}.sheet{transform:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head>
<body><main class="sheet" aria-label="{{documentLabel}}">
<div class="masthead"><a class="brand" href="https://aberbach.co" aria-label="Soufiane Aberbach"><span>SA</span><i aria-hidden="true"></i></a></div>
<header class="hero"><div class="identity"><h1 class="name"><span>Soufiane</span><span>Aberbach</span></h1><p class="title">{{displayTitle}}</p></div><figure class="portrait-frame"><img class="portrait" src="{{portrait}}" alt="Soufiane Aberbach"></figure></header>
<address class="contact"><span class="contact__location">{{location}}</span><a href="https://aberbach.co">aberbach.co</a><a href="mailto:{{email}}">{{email}}</a><a href="https://www.linkedin.com/in/soufiane-aberbach-6799b7155">LinkedIn</a></address>
<div class="body-grid"><aside class="sidebar" data-flow>
<section class="profile"><h2 class="section-title">{{profileLabel}}</h2><p>{{summary}}</p></section>
<section class="expertise"><h2 class="section-title">{{expertiseLabel}}</h2>{{skills}}</section>
<section class="software"><h2 class="section-title">{{softwareLabel}}</h2><p>{{software}}</p></section>
<section class="languages"><h2 class="section-title">{{languagesLabel}}</h2><p>{{languages}}</p></section>
</aside><div class="main-copy" data-flow><section class="experience"><h2 class="section-title">{{experienceLabel}}</h2>{{roles}}</section><section class="practice"><h2 class="section-title">{{practiceLabel}}</h2>{{practice}}</section></div></div>
<img class="atelier" src="{{atelier}}" alt="" aria-hidden="true">
<footer class="footer"><a href="https://aberbach.co">ABERBACH.CO</a><span>{{footer}}</span></footer>
</main></body></html>
