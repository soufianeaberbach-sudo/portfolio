<!doctype html>
<html lang="{{locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soufiane Aberbach — {{edition}}</title>
<style>
{{fonts}}
:root{--ink:#161616;--muted:#626262;--accent:#D45F36;--line:#d9d9d9;--display:Archivo,'Arial',sans-serif;--body:Inter,'Arial',sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:var(--ink)}body{font-family:var(--body);font-size:12px;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.sheet{position:relative;width:210mm;height:297mm;background:#fff;overflow:hidden;padding:44px 51px 40px}.masthead{display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:1.8px;font-weight:650}.masthead__brand{font-family:var(--display);font-weight:800;letter-spacing:1.2px}.masthead__edition{font-size:8px;color:var(--muted);letter-spacing:1.1px}.identity{margin-top:28px;display:grid;grid-template-columns:1fr 139px;gap:24px;align-items:start}.name{font-family:var(--display);font-size:58px;line-height:.96;letter-spacing:-2.6px;font-weight:750;margin:0 0 17px}.name span{display:block}.title span{display:block}.title{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.25;letter-spacing:-.3px;max-width:430px;margin:0}.portrait{width:139px;height:183px;object-fit:cover;object-position:center 31%;filter:grayscale(1);display:block}.portrait-frame{position:relative}.portrait-frame:after{content:'';position:absolute;bottom:-7px;left:0;background:var(--accent);width:23px;height:3px}.contact{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:10px;color:var(--muted);margin-top:24px;line-height:1.5;letter-spacing:.05px}.contact__location{color:var(--ink)}.intro{border-top:1.2px solid var(--ink);margin-top:23px;padding-top:17px}.summary{font-size:12px;line-height:1.65;margin:0;max-width:656px;letter-spacing:-.05px}.columns{margin-top:30px;display:grid;grid-template-columns:193px 1fr;gap:36px}.section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;margin:0 0 24px;display:flex;align-items:center;gap:10px}.section-title:before{content:'';width:15px;height:2px;background:var(--accent);flex:none}.skill-group{margin:0 0 17px}.skill-group h3{font-size:10.75px;font-weight:650;line-height:1.4;margin:0 0 7px}.skill-group p{font-size:11.25px;color:var(--muted);line-height:1.58;margin:0}.tools{border-top:1px solid var(--line);padding-top:17px;margin-top:20px}.tools .section-title{margin-bottom:15px}.tools p{font-size:11.25px;line-height:1.8;margin:0;color:var(--muted)}.languages{margin-top:18px}.languages .section-title{margin-bottom:11px}.languages p{font-size:11.25px;line-height:1.6;color:var(--muted);margin:0}.experience .section-title{margin-bottom:21px}.role{margin-bottom:23px;break-inside:avoid}.role:last-child{margin-bottom:0}.role__meta{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted);letter-spacing:.25px;line-height:1.5;margin-bottom:5px}.role--current .role__meta:before{content:'';width:5px;height:5px;border-radius:100%;background:var(--accent);display:block}.role__company{font-family:var(--display);font-size:18px;line-height:1.1;letter-spacing:-.4px;margin:0 0 4px;font-weight:650}.role--current .role__company{font-size:24px;letter-spacing:-.5px}.role__title{font-size:11.5px;line-height:1.4;font-weight:550;margin:0;max-width:405px}.role--current .role__title{font-size:12px;font-weight:650;line-height:1.4}.role__scope{font-size:10px;color:var(--muted);line-height:1.6;margin:8px 0 0;max-width:400px}.footer{position:absolute;bottom:39px;left:51px;right:51px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-size:8px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}.footer__signature{font-family:var(--display);font-weight:600;letter-spacing:1px;color:var(--ink)}
html[data-render='png'],html[data-render='png'] body{width:2480px;height:3508px;overflow:hidden}html[data-render='png'] .sheet{transform:scale(3.1246031746);transform-origin:top left}
@page{size:A4;margin:0}@media print{html,body{width:210mm;height:297mm}.sheet{transform:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<main class="sheet" aria-label="{{documentLabel}}">
<div class="masthead"><span class="masthead__brand">ABERBACH.CO</span><span class="masthead__edition">{{edition}}</span></div>
<header class="identity"><div><h1 class="name"><span>SOUFIANE</span><span>ABERBACH</span></h1><p class="title">{{displayTitle}}</p></div><div class="portrait-frame"><img class="portrait" src="{{portrait}}" alt="Soufiane Aberbach"></div></header>
<address class="contact" style="font-style:normal"><span class="contact__location">{{location}}</span><a href="https://aberbach.co">aberbach.co</a><a href="mailto:{{email}}">{{email}}</a></address>
<section class="intro" aria-label="{{profileLabel}}"><p class="summary">{{summary}}</p></section>
<div class="columns"><aside><section><h2 class="section-title">{{expertiseLabel}}</h2>{{skills}}</section><section class="tools"><h2 class="section-title">{{softwareLabel}}</h2><p>{{software}}</p></section><section class="languages"><h2 class="section-title">{{languagesLabel}}</h2><p>{{languages}}</p></section></aside><section class="experience"><h2 class="section-title">{{experienceLabel}}</h2>{{roles}}</section></div>
<footer class="footer"><span class="footer__signature">{{footer}}</span><span>01 / 01</span></footer>
</main>
</body>
</html>
